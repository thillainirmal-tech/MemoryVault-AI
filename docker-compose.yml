services:
  postgres:
    image: postgres:17.6-alpine
    environment: {POSTGRES_DB: memoryvault, POSTGRES_USER: memoryvault, POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD}"}
    volumes: ["memoryvault-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U memoryvault"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: .
    ports: ["8085:8085"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/memoryvault
      DATABASE_USERNAME: memoryvault
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      MEMORY_ENCRYPTION_KEY: ${MEMORY_ENCRYPTION_KEY:?set MEMORY_ENCRYPTION_KEY}
      MEMORY_API_KEY: ${MEMORY_API_KEY:?set MEMORY_API_KEY}
    depends_on: {postgres: {condition: service_healthy}}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
volumes: {memoryvault-data: {}}
