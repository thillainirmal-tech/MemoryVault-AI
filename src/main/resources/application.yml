spring:
  application.name: memoryvault-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/memoryvault}
    username: ${DATABASE_USERNAME:memoryvault}
    password: ${DATABASE_PASSWORD:memoryvault}
server.port: ${PORT:8085}
management.endpoints.web.exposure.include: health,info,prometheus
management.endpoint.health.probes.enabled: true
memoryvault:
  encryption-key: ${MEMORY_ENCRYPTION_KEY}
  api-key: ${MEMORY_API_KEY:change-me-before-production-32chars}
